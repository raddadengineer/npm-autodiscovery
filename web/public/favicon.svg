<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background icon card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Server Unit 1 -->
  <rect x="12" y="14" width="40" height="15" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="url(#stroke-grad)" stroke-width="2.5" />
  <circle cx="20" cy="21.5" r="2.5" fill="#10b981" filter="url(#glow)" />
  <line x1="28" y1="21.5" x2="44" y2="21.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Server Unit 2 -->
  <rect x="12" y="35" width="40" height="15" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="url(#stroke-grad)" stroke-width="2.5" />
  <circle cx="20" cy="42.5" r="2.5" fill="#06b6d4" filter="url(#glow)" />
  <line x1="28" y1="42.5" x2="44" y2="42.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>
