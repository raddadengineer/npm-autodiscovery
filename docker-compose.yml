services:
  # ============================================================================
  # 1. NPM Auto-Discovery (Standalone Service - Always Runs)
  # ============================================================================
  npm-autodiscovery:
    build:
      context: .
      dockerfile: Dockerfile
    image: sampson/npm-autodiscovery:latest
    container_name: npm-autodiscovery
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080' # Auto-Discovery Management Dashboard & API
    environment:
      # Target Nginx Proxy Manager instance (can be container name, IP, or hostname)
      - NPM_URL=${NPM_URL:-http://nginx-proxy-manager:81}
      - NPM_USER=${NPM_USER:-admin@example.com}
      - NPM_PASS=${NPM_PASS:-changeme}
      - NPM_NETWORK=${NPM_NETWORK:-npm-network}
      - FORWARD_HOST_STRATEGY=${FORWARD_HOST_STRATEGY:-auto}
      - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      - DEFAULT_FORWARD_SCHEME=${DEFAULT_FORWARD_SCHEME:-http}
      - DEFAULT_SSL_ENABLED=${DEFAULT_SSL_ENABLED:-false}
      - DEFAULT_WEBSOCKET=${DEFAULT_WEBSOCKET:-true}
      # Multi-Host / Cluster Configuration
      # Unique node identifier (defaults to hostname if omitted)
      - HOST_ID=${HOST_ID:-}
      # Set HOST_IP if this host is remote from the NPM instance so NPM forwards traffic to this host IP/DNS
      - HOST_IP=${HOST_IP:-}
      - USE_HOST_PORT=${USE_HOST_PORT:-false}
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      # Read-only Docker socket mapping allows listening to container events
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm-network

  # ============================================================================
  # 2. Optional: Nginx Proxy Manager (Only starts with: --profile with-npm)
  # ============================================================================
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    profiles:
      - with-npm
      - all-in-one
    ports:
      - '80:80'     # Public HTTP Traffic
      - '443:443'   # Public HTTPS Traffic
      - '81:81'     # NPM Admin Web UI & Official API
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - npm-network

  # ============================================================================
  # 3. Optional: Demo Target Service (Only starts with: --profile demo)
  # ============================================================================
  demo-whoami:
    image: traefik/whoami:latest
    container_name: demo-whoami
    restart: unless-stopped
    profiles:
      - demo
      - all-in-one
    networks:
      - npm-network
    labels:
      - "npm.frontend.domain=whoami.local"
      - "npm.frontend.port=80"
      - "npm.forward_scheme=http"
      - "npm.websocket=true"
      - "npm.block_exploits=true"
      - "npm.ssl.enabled=false"

volumes:
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local

networks:
  npm-network:
    name: ${NPM_NETWORK:-npm-network}
    driver: bridge
