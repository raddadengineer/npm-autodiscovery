services:
  # ============================================================================
  # 1. NPM Auto-Discovery (Standalone Service - Always Runs)
  # ============================================================================
  npm-autodiscovery:
    build:
      context: .
      dockerfile: Dockerfile
    image: raddadengineer/npm-autodiscovery:latest
    container_name: npm-autodiscovery
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:${PORT:-8080}' # Auto-Discovery Management Dashboard & API
    env_file:
      - .env
    volumes:
      # Read-only Docker socket mapping allows listening to container events
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm-network

  # ============================================================================
  # 2. Optional: Nginx Proxy Manager (Only starts with: --profile with-npm)
  # ============================================================================
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    profiles:
      - with-npm
      - all-in-one
    ports:
      - '80:80' # Public HTTP Traffic
      - '443:443' # Public HTTPS Traffic
      - '81:81' # NPM Admin Web UI & Official API
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - npm-network

  # ============================================================================
  # 3. Optional: Demo Target Service (Only starts with: --profile demo)
  # ============================================================================
  demo-whoami:
    image: raddadengineer/whoami:latest
    container_name: demo-whoami
    restart: unless-stopped
    profiles:
      - demo
      - all-in-one
    networks:
      - npm-network
    labels:
      - "npm.frontend.domain=whoami.local"
      - "npm.frontend.port=80"
      - "npm.forward_scheme=http"
      - "npm.websocket=true"
      - "npm.block_exploits=true"
      - "npm.ssl.enabled=false"

volumes:
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local

networks:
  npm-network:
    name: ${NPM_NETWORK:-npm-network}
    driver: bridge
